[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "komga-tag-readlist-sync"
version = "0.3.0"
description = "Synchronize Komga book tags to managed readlists"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KTRS maintainers" }]
dependencies = []

[project.scripts]
ktrs = "ktrs.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
